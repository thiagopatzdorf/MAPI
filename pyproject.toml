[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapi-contracts"
version = "0.1.0"
description = "One contract per capability, readable by programs (API), agents (MCP) and auditors: effect, consent, inverse, proof, budget and who may call it."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.18"]

[project.scripts]
mapi = "mapi.__main__:_cli"

[tool.setuptools.packages.find]
include = ["mapi*"]
