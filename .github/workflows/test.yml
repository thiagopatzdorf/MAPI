# CI of the public mirror thiagopatzdorf/MAPI. The canonical source is a monorepo where this file
# does not run; here a GitHub-hosted runner is what any fork also gets.
name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - run: pytest -q tests
      # Every example contract must pass every refusal rule.
      - run: for f in examples/*.mapi.yaml; do mapi check "$f"; done
